name: Zapier app

on:
  push:
    branches: [main]
    paths:
      - integrations/zapier-app/**
      - .github/workflows/zapier-app.yml
  pull_request:
    paths:
      - integrations/zapier-app/**
      - .github/workflows/zapier-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapier-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier-app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
      - name: Check pinned npm
        run: test "$(npm --version)" = 10.9.9
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Validate with Zapier checks
        shell: bash
        run: |
          set -euo pipefail
          npx zapier-platform validate --fail-for-publishing 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee validate.log
          grep -qx '    - 0 checks failed' validate.log
