name: n8n community node provenance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed main commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: n8n-community-node-provenance
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  build:
    if: github.repository == 'kochetkov-ma/brewpage-publish-plugins' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
      - name: Pin npm and validate source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm install --global npm@11.15.0 --ignore-scripts
          test "$(npm --version)" = 11.15.0
      - name: Install locked tooling without lifecycle scripts
        working-directory: integrations/n8n-community-node
        run: npm ci --ignore-scripts
      - name: Check format, build and unit guards
        id: code_checks
        working-directory: integrations/n8n-community-node
        run: |
          set -euo pipefail
          npm run format
          npm run build
          npm test
          npm run test:provenance
      - name: Execute four isolated native engine fixtures
        id: native_checks
        working-directory: integrations/n8n-community-node
        run: |
          set -euo pipefail
          docker pull docker.n8n.io/n8nio/n8n@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b
          npm run test:native
      - name: Pack once with exact allowlist
        working-directory: integrations/n8n-community-node/package
        run: |
          set -euo pipefail
          npm_root="$(npm root --global)/npm"
          node scripts/provenance.cjs pack "$npm_root"
      - name: Record actual code and native check results
        working-directory: integrations/n8n-community-node/package
        env:
          CODE_RESULT: ${{ steps.code_checks.outcome }}
          NATIVE_RESULT: ${{ steps.native_checks.outcome }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const results = {code: process.env.CODE_RESULT, native: process.env.NATIVE_RESULT};
          assert.deepEqual(results, {code: 'success', native: 'success'}, 'Both release checks must pass');
          fs.writeFileSync('release/checks.json', JSON.stringify(results) + '\n', {flag: 'wx'});
          JS
      - name: Upload unsigned same-run release input
        uses: actions/upload-artifact@v7.0.2
        with:
          name: n8n-nodes-brewpage-unsigned-${{ github.sha }}
          path: integrations/n8n-community-node/package/release/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    if: github.repository == 'kochetkov-ma/brewpage-publish-plugins' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
      - name: Pin npm without installing the development toolchain
        run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: n8n-nodes-brewpage-unsigned-${{ github.sha }}
          path: integrations/n8n-community-node/package/release/
      - name: Sign and verify exact same-run artifact
        working-directory: integrations/n8n-community-node/package
        run: |
          set -euo pipefail
          npm_root="$(npm root --global)/npm"
          node scripts/provenance.cjs sign "$npm_root" release/n8n-nodes-brewpage-0.1.0.tgz release/n8n-nodes-brewpage-0.1.0.sigstore "$EXPECTED_SHA"
          node scripts/provenance.cjs verify "$npm_root" release/n8n-nodes-brewpage-0.1.0.tgz release/n8n-nodes-brewpage-0.1.0.sigstore "$EXPECTED_SHA" "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
      - name: Upload signed and verified release evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: n8n-nodes-brewpage-0.1.0-${{ github.sha }}
          path: integrations/n8n-community-node/package/release/
          if-no-files-found: error
          retention-days: 1

  catalog_qualification:
    if: github.repository == 'kochetkov-ma/brewpage-publish-plugins' && github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
      - name: Pin npm
        run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Preserve official catalog qualification result
        working-directory: integrations/n8n-community-node
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
